# ali/1Panel 部署编排：TLS 由 1Panel OpenResty 终止，web 仅绑 127.0.0.1 供其反代。用法见 deploy/ali/README.md。
name: kairos
services:
  db:
    image: postgres:16-alpine
    container_name: kairos-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
    shm_size: 128mb
    mem_limit: 192m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请在 .env 中填写}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./server
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    container_name: kairos-api
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - .env
    environment:
      KAIROS_DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ai_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://localhost:$${KAIROS_API_PORT:-8080}/healthz/live\" >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NGINX_CONF: deploy/ali/nginx.conf
    container_name: kairos-web
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:${KAIROS_WEB_PORT:-18081}:80"
    depends_on:
      - api

volumes:
  pg_data:
  ai_data:
